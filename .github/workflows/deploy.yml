name: Déploiement

on:
  push:
    branches: [main]

jobs:
  dev:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install paramiko

      - name: Déployer sur le serveur (bascule par renommage)
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: python deploy_ci.py deploy

      - name: Vérifier que le site répond (healthcheck)
        id: healthcheck
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -u "${{ secrets.DEV_BASICAUTH_USER }}:${{ secrets.DEV_BASICAUTH_PASSWORD }}" \
            "http://dev.aeroclub-saumur.fr/")
          echo "Code HTTP reçu : $code"
          if [ "$code" != "200" ] && [ "$code" != "302" ]; then
            echo "Healthcheck en échec (code $code)"
            exit 1
          fi

      - name: "Premier déploiement en échec : rollback ignoré"
        if: failure() && steps.deploy.outputs.bootstrap == 'true'
        run: |
          echo "Premier déploiement sur ce dossier : le healthcheck peut échouer normalement tant que le domaine ne pointe pas encore dessus."
          echo "Dossier conservé tel quel, pas de rollback."

      - name: Revenir en arrière si le healthcheck a échoué
        if: failure() && steps.deploy.outcome == 'success' && steps.deploy.outputs.bootstrap != 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: python deploy_ci.py rollback

  prod:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install paramiko

      - name: Déployer sur le serveur (bascule par renommage)
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_PROD }}
          GENERER_CONFIG_LOCAL: "1"
          PROD_DB_HOST: ${{ secrets.PROD_DB_HOST }}
          PROD_DB_PORT: ${{ secrets.PROD_DB_PORT }}
          PROD_DB_NAME: ${{ secrets.PROD_DB_NAME }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_STRIPE_PK: ${{ secrets.PROD_STRIPE_PK }}
          PROD_STRIPE_SK: ${{ secrets.PROD_STRIPE_SK }}
          PROD_STRIPE_WHSEC: ${{ secrets.PROD_STRIPE_WHSEC }}
          PROD_INSTALLER_SECRET: ${{ secrets.PROD_INSTALLER_SECRET }}
          PROD_OPS_SECRET: ${{ secrets.PROD_OPS_SECRET }}
        run: python deploy_ci.py deploy

      - name: Vérifier que le site répond (healthcheck)
        id: healthcheck
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://aeroclub-saumur.fr/")
          echo "Code HTTP reçu : $code"
          if [ "$code" != "200" ] && [ "$code" != "302" ]; then
            echo "Healthcheck en échec (code $code)"
            exit 1
          fi

      # Mises à jour de la base (site/migrations/*.sql), chacune appliquée
      # une seule fois — voir site/taches/migrer.php. Un échec ne doit pas
      # faire revenir le code en arrière (continue-on-error) : on prévient
      # par e-mail, et la migration est retentée au déploiement suivant.
      - name: Appliquer les mises à jour de la base de données
        continue-on-error: true
        env:
          OPS_SECRET: ${{ secrets.PROD_OPS_SECRET }}
        run: |
          code=$(curl -s -o resultat-migrations.txt -w "%{http_code}" -X POST \
            "https://aeroclub-saumur.fr/taches/migrer.php" --data-urlencode "k=$OPS_SECRET")
          cat resultat-migrations.txt
          if [ "$code" != "200" ]; then
            echo "Migrations en échec (HTTP $code)"
            curl -s -X POST "https://aeroclub-saumur.fr/taches/notifier.php" \
              --data-urlencode "k=$OPS_SECRET" \
              --data-urlencode "sujet=[Saumur] Échec de mise à jour de la base au déploiement" \
              --data-urlencode "corps@resultat-migrations.txt" || true
            exit 1
          fi

      - name: "Premier déploiement en échec : rollback ignoré"
        if: failure() && steps.deploy.outputs.bootstrap == 'true'
        run: |
          echo "Premier déploiement sur ce dossier : le healthcheck peut échouer normalement tant que le domaine ne pointe pas encore dessus."
          echo "Dossier conservé tel quel, pas de rollback."

      - name: Revenir en arrière si le healthcheck a échoué
        if: failure() && steps.deploy.outcome == 'success' && steps.deploy.outputs.bootstrap != 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_PROD }}
        run: python deploy_ci.py rollback
